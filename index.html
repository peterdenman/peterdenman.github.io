<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Focus Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 25px;
            border-bottom: 2px solid #e1e4e8;
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .config-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 320px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 20px;
        }
        @media (max-width: 992px) { .grid { grid-template-columns: 1fr; } }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        h2 { margin-top: 0; color: #1a202c; border-bottom: 1px solid #edf2f7; padding-bottom: 8px; }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }
        input[type="text"], input[type="password"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 1em;
            box-sizing: border-box;
            background: white;
        }
        textarea { font-family: inherit; resize: vertical; }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }
        button:disabled { background: #cbd5e0; color: #718096; cursor: not-allowed; }
        .btn-primary { background: #3182ce; color: white; }
        .btn-success { background: #38a169; color: white; }
        .btn-audio { background: #dd6b20; color: white; }
        .btn-nav { background: #4a5568; color: white; max-width: 100px; }
        .btn-recording { background: #e53e3e; color: white; animation: pulse 1.5s infinite; }
        .btn-1 { background: #feb2b2; color: #9b2c2c; } 
        .btn-2 { background: #fbd38d; color: #9c4221; } 
        .btn-3 { background: #9ae6b4; color: #22543d; } 
        .btn-4 { background: #63b3ed; color: #2a4365; } 
        button:hover { opacity: 0.85; }
        ul { list-style: none; padding: 0; }
        li {
            padding: 15px;
            background: #f7fafc;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #cbd5e0;
        }
        .ai-analysis {
            background: #ebf8ff;
            border-left: 4px solid #3182ce;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            white-space: pre-wrap;
            font-size: 0.95em;
            line-height: 1.6;
        }
        .status-msg { margin-top: 10px; font-weight: bold; color: #4a5568; }
        .action-links { font-size: 0.85em; display: flex; gap: 10px; margin-top: 5px;}
        .action-links span { cursor: pointer; color: #3182ce; text-decoration: underline; }
        .hidden { display: none; }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            font-size: 0.75em;
            font-weight: bold;
            border-radius: 4px;
            margin-top: 4px;
        }
        .note-item {
            background: #ebf8ff;
            border-left: 3px solid #3182ce;
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 style="margin:0; font-size: 1.8em;">Study Tracker</h1>
            <div id="syncStatus" style="font-size: 0.85em; font-weight: bold; color: #e53e3e; margin-top: 4px;">Sync: Offline</div>
        </div>
        <div class="config-panel">
            <input type="password" id="apiKeyInput" placeholder="Gemini API Key" onchange="saveConfig()">
            <input type="password" id="githubPatInput" placeholder="GitHub Token" onchange="saveConfig()">
            <input type="text" id="githubRepoInput" placeholder="username/repo" onchange="saveConfig()">
        </div>
    </header>

    <div class="grid">
        <!-- LEFT PANEL -->
        <div>
            <!-- MODULE 1: LOG REVIEW WITH MODALITY -->
            <div class="card">
                <h2>Log Spaced Review</h2>
                <div class="input-group">
                    <input type="text" id="fsrsTopicInput" placeholder="Topic / Lecture Name">
                </div>
                <div class="input-group">
                    <select id="modalitySelect">
                        <option value="Anki">Anki Flashcards</option>
                        <option value="Q-Bank">Practice Questions (Q-Bank)</option>
                        <option value="TEACH">TEACH Slide Pass</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button class="btn-1" onclick="submitQuickFSRS(1)">Again (1)</button>
                    <button class="btn-2" onclick="submitQuickFSRS(2)">Hard (2)</button>
                    <button class="btn-3" onclick="submitQuickFSRS(3)">Good (3)</button>
                    <button class="btn-4" onclick="submitQuickFSRS(4)">Easy (4)</button>
                </div>
            </div>

            <!-- MODULE 2: TEACH RUN OVERLAY -->
            <div class="card">
                <h2>Explanation Checker</h2>
                <div class="input-group">
                    <input type="file" id="pdfFileInput" accept="application/pdf">
                </div>
                <div class="input-group">
                    <textarea id="learningObjectivesInput" rows="2" placeholder="Optional: Paste syllabus Learning Objectives here..."></textarea>
                </div>
                <button class="btn-primary" style="width:100%;" onclick="initializeTeachSession()">Load Deck</button>
            </div>

            <!-- ACTIVE RUNNER LAYOUT -->
            <div class="card hidden" id="sandboxCard">
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; margin-bottom: 15px;">
                    <h3 style="margin:0; color:#2b6cb0;">Recall Sandbox</h3>
                    <span style="font-weight:bold; color:#4a5568; background:#edf2f7; padding:4px 10px; border-radius:12px; font-size:0.85em;">
                        Total Deck: <span id="totalSlidesNum">1</span> Slides
                    </span>
                </div>

                <div class="input-group">
                    <label style="font-weight:bold; font-size:0.85em; color:#4a5568;">Select Slide Range to Audit (e.g. 1-3, 5, 8-10):</label>
                    <input type="text" id="slideRangeInput" value="1" placeholder="e.g. 1-3 or 4,5,6">
                </div>
                
                <div class="input-group">
                    <textarea id="userTextInput" rows="4" placeholder="Type core mechanics, structures, or rules from memory for these slides..."></textarea>
                </div>

                <div class="input-group">
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-audio" id="recordBtn" onclick="toggleAudioRecording()">Record Audio Pass</button>
                        <audio id="audioPlayback" controls class="hidden" style="flex: 1; height: 40px;"></audio>
                    </div>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px;">
                    <button class="btn-success" style="width:100%;" id="gradeBtn" onclick="runGeminiGrading()">Audit Selected Range</button>
                </div>

                <div id="aiOutputBlock" class="hidden" style="margin-top: 25px; border-top: 1px dashed #cbd5e0; padding-top: 20px;">
                    <div class="ai-analysis" id="aiAnalysisText"></div>
                </div>
            </div>
            <div id="statusMessage" class="status-msg"></div>
        </div>

        <!-- RIGHT PANEL -->
        <div>
            <!-- DAILY FOCUS QUEUE -->
            <div class="card">
                <h2>Daily Focus Queue</h2>
                <ul id="scheduleList"></ul>
            </div>

            <!-- TOPIC NOTEBOOK MODULE -->
            <div class="card" id="notebookCard">
                <h2 style="display:flex; justify-content:space-between; align-items:center;">
                    <span>Topic Notebook</span>
                    <span id="activeNotebookTitle" style="font-size:0.7em; color:#3182ce; font-weight:normal;">(Select a topic above)</span>
                </h2>
                
                <div class="input-group">
                    <textarea id="newNoteInput" rows="2" placeholder="Add a key concept, learning objective, or equation to review for this topic..."></textarea>
                    <button class="btn-primary" style="padding: 8px;" onclick="addNoteToActiveTopic()">Add Note</button>
                </div>

                <div id="notesContainer" style="margin-top: 15px;">
                    <p style="color:#718096; font-size:0.9em; margin:0;">Click any topic name in your queue to view or add review notes.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { GoogleGenAI } from "https://esm.run/@google/genai";

    window.parsedSlidesArray = []; 
    window.mediaRecorder = null;
    window.audioChunks = [];
    window.audioBlob = null;
    window.isRecording = false;
    window.currentFileSha = ""; 
    window.activeNotebookTopic = "";

    document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || "";
    document.getElementById('githubPatInput').value = localStorage.getItem('github_pat') || "";
    document.getElementById('githubRepoInput').value = localStorage.getItem('github_repo') || "";

    window.saveConfig = function() {
        localStorage.setItem('gemini_api_key', document.getElementById('apiKeyInput').value.trim());
        localStorage.setItem('github_pat', document.getElementById('githubPatInput').value.trim());
        localStorage.setItem('github_repo', document.getElementById('githubRepoInput').value.trim());
        pullFromGitHubCloud();
    }

    async function pullFromGitHubCloud() {
        const token = localStorage.getItem('github_pat');
        const repo = localStorage.getItem('github_repo');
        const syncLabel = document.getElementById('syncStatus');
        if (!token || !repo) return;

        const url = `https://api.github.com/repos/${repo}/contents/database.json`;
        try {
            const res = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
            if (res.status === 200) {
                const data = await res.json();
                window.currentFileSha = data.sha;
                const decodedState = decodeURIComponent(escape(atob(data.content)));
                localStorage.setItem('teach_program_db', decodedState);
                syncLabel.innerHTML = "Sync: Connected";
                syncLabel.style.color = "#38a169";
                window.displaySchedule();
                if (window.activeNotebookTopic) window.loadNotebook(window.activeNotebookTopic);
            }
        } catch(err) { console.error(err); }
    }
    window.pullFromGitHubCloud = pullFromGitHubCloud;

    async function pushToGitHubCloud(updatedDatabaseObj) {
        const token = localStorage.getItem('github_pat');
        const repo = localStorage.getItem('github_repo');
        if (!token || !repo) return;

        const url = `https://api.github.com/repos/${repo}/contents/database.json`;
        const contentStr = JSON.stringify(updatedDatabaseObj, null, 2);
        const encodedContent = btoa(unescape(encodeURIComponent(contentStr)));

        const bodyData = {
            message: "FSRS Master Queue Update",
            content: encodedContent,
            sha: window.currentFileSha
        };
        try {
            const res = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(bodyData)
            });
            if (res.status === 200 || res.status === 201) {
                const resData = await res.json();
                window.currentFileSha = resData.content.sha;
            }
        } catch(err) { console.error(err); }
    }
    window.pushToGitHubCloud = pushToGitHubCloud;

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    window.initializeTeachSession = function() {
        const fileField = document.getElementById('pdfFileInput').files[0];
        const status = document.getElementById('statusMessage');
        if (!fileField) return;

        status.innerHTML = "Parsing document pages...";
        const reader = new FileReader();
        reader.onload = function(e) {
            const typedarray = new Uint8Array(e.target.result);
            pdfjsLib.getDocument({data: typedarray}).promise.then(pdf => {
                let parsePromises = [];
                for (let i = 1; i <= pdf.numPages; i++) {
                    parsePromises.push(pdf.getPage(i).then(page => page.getTextContent().then(content => {
                        return { slideNum: i, text: content.items.map(item => item.str).join(" ") };
                    })));
                }
                Promise.all(parsePromises).then(slides => {
                    window.parsedSlidesArray = slides;
                    document.getElementById('totalSlidesNum').innerText = window.parsedSlidesArray.length;
                    document.getElementById('sandboxCard').classList.remove('hidden');
                    status.innerHTML = "";
                    
                    const activeName = document.getElementById('fsrsTopicInput').value.trim();
                    if (activeName) {
                        document.getElementById('statusMessage').innerHTML = `<span style='color:#38a169;'>Loaded slides for "${activeName}"</span>`;
                    }
                });
            });
        };
        reader.readAsArrayBuffer(fileField);
    }

    function parseSlideRangeString(rangeStr, maxSlides) {
        const slideNumbers = new Set();
        const parts = rangeStr.split(',');
        
        parts.forEach(part => {
            const trimmed = part.trim();
            if (trimmed.includes('-')) {
                const [start, end] = trimmed.split('-').map(num => parseInt(num.trim(), 10));
                if (!isNaN(start) && !isNaN(end)) {
                    for (let i = Math.min(start, end); i <= Math.max(start, end); i++) {
                        if (i >= 1 && i <= maxSlides) slideNumbers.add(i);
                    }
                }
            } else {
                const num = parseInt(trimmed, 10);
                if (!isNaN(num) && num >= 1 && num <= maxSlides) {
                    slideNumbers.add(num);
                }
            }
        });
        
        return Array.from(slideNumbers).sort((a, b) => a - b);
    }

    window.toggleAudioRecording = function() {
        const recordBtn = document.getElementById('recordBtn');
        if (!window.isRecording) {
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                window.mediaRecorder = new MediaRecorder(stream);
                window.audioChunks = [];
                window.mediaRecorder.ondataavailable = e => { if (e.data.size > 0) window.audioChunks.push(e.data); };
                window.mediaRecorder.onstop = () => {
                    window.audioBlob = new Blob(window.audioChunks, { type: 'audio/mp3' });
                    document.getElementById('audioPlayback').src = URL.createObjectURL(window.audioBlob);
                    document.getElementById('audioPlayback').classList.remove('hidden');
                };
                window.mediaRecorder.start();
                window.isRecording = true;
                recordBtn.innerText = "Stop";
                recordBtn.className = "btn-recording";
            });
        } else {
            window.mediaRecorder.stop();
            window.isRecording = false;
            recordBtn.innerText = "Record Audio Pass";
            recordBtn.className = "btn-audio";
        }
    }

    window.runGeminiGrading = function() {
        const apiKey = localStorage.getItem('gemini_api_key');
        const textExplanation = document.getElementById('userTextInput').value.trim();
        const rangeInput = document.getElementById('slideRangeInput').value.trim();
        const learningObjectives = document.getElementById('learningObjectivesInput').value.trim();
        const status = document.getElementById('statusMessage');

        if (!apiKey) { alert("Missing Gemini API key"); return; }
        if (!window.parsedSlidesArray || window.parsedSlidesArray.length === 0) return;

        const targetSlideIndices = parseSlideRangeString(rangeInput, window.parsedSlidesArray.length);
        if (targetSlideIndices.length === 0) {
            alert("Invalid slide range specified.");
            return;
        }

        let combinedSlideText = targetSlideIndices.map(num => {
            const slideObj = window.parsedSlidesArray.find(s => s.slideNum === num);
            return `--- SLIDE #${num} ---\n${slideObj ? slideObj.text : ''}`;
        }).join("\n\n");

        status.innerHTML = "Analyzing multi-slide recall...";
        document.getElementById('aiOutputBlock').classList.remove('hidden');
        document.getElementById('aiAnalysisText').innerText = `Comparing recall against Slide(s) ${targetSlideIndices.join(', ')}...`;

        const ai = new GoogleGenAI({ apiKey: apiKey });

        let loBlock = learningObjectives ? `\n\n[SYLLABUS LEARNING OBJECTIVES]:\n${learningObjectives}` : '';

        const systemPrompt = `You are an expert medical school reviewer auditing a student's recall of a block of lecture slides.
Compare their explanation directly against the provided slide text AND syllabus learning objectives (if present).
Output a direct, short list evaluating:
1. Learning Objective Alignment (Did they answer the core objective?)
2. Missing Key Terms/Structures across the selected slides
3. Accurate Hits
Be brief and direct.`;

        const textPart = `[TARGET SLIDES DATA (Slides: ${targetSlideIndices.join(', ')})]:\n${combinedSlideText}${loBlock}\n\n[STUDENT RECALL RUN]:\n${textExplanation}`;
        const promptArray = [systemPrompt, textPart];

        if (window.audioBlob) {
            const reader = new FileReader();
            reader.onloadend = () => {
                promptArray.push({ inlineData: { data: reader.result.split(',')[1], mimeType: window.audioBlob.type } });
                executeCall(ai, promptArray);
            };
            reader.readAsDataURL(window.audioBlob);
        } else {
            executeCall(ai, promptArray);
        }
    }

    function executeCall(aiInstance, contentArray) {
        aiInstance.models.generateContent({
            model: 'gemini-3.5-flash',
            contents: contentArray,
        }).then(res => {
            document.getElementById('aiAnalysisText').innerText = res.text;
            document.getElementById('statusMessage').innerHTML = "";
        });
    }

    pullFromGitHubCloud();
</script>

<script>
    class FSRSEngine {
        constructor() {
            this.w = [
                0.4025, 1.4612, 3.3458, 15.6889, 5.8273, 0.7259, 1.0652, 0.0631, 
                2.1818, 0.1654, 1.0523, 0.8123, 0.9024, 0.4497, 1.5472, 0.4018, 
                0.3951, 0.1118, 0.8974
            ];
            this.targetRetention = 0.85; 
        }
        initializeTopic(grade) {
            return { stability: this.w[grade - 1], difficulty: Math.max(1, Math.min(10, this.w[4] - (grade - 3))) };
        }
        calculateRetrievability(stability, elapsedDays) {
            if (elapsedDays <= 0) return 1.0;
            return Math.pow(1 + 0.07895 * (elapsedDays / stability), -this.w[18]);
        }
        updateTopic(currentStability, currentDifficulty, elapsedDays, grade) {
            let nextDifficulty = Math.max(1, Math.min(10, currentDifficulty - 0.1 * (grade - 3)));
            if (elapsedDays < 0.2) { 
                return { stability: currentStability * Math.exp(this.w[16] * (grade - 3 + this.w[17]) * Math.pow(currentStability, -this.w[18])), difficulty: nextDifficulty };
            }
            const R = this.calculateRetrievability(currentStability, elapsedDays);
            let nextStability = grade === 1 ? 
                Math.min(this.w[9] * Math.pow(nextDifficulty, -this.w[10]) * Math.pow(currentStability, this.w[11]) * Math.exp(this.w[12] * (1 - R)), currentStability) :
                currentStability * (Math.exp(this.w[6] * (11 - nextDifficulty)) * Math.pow(currentStability, -this.w[7]) * (Math.exp(this.w[8] * (1 - R)) - 1) + 1) * (grade === 2 ? this.w[15] : 1.0) * (grade === 4 ? this.w[16] : 1.0);
            return { stability: nextStability, difficulty: nextDifficulty };
        }
        calculateNextInterval(stability) {
            return Math.max(1, Math.round(stability * ((Math.pow(this.targetRetention, -1 / this.w[18]) - 1) / (Math.pow(0.9, -1 / this.w[18]) - 1))));
        }
    }

    const fsrs = new FSRSEngine();

    window.submitQuickFSRS = function(grade) {
        const inputField = document.getElementById('fsrsTopicInput');
        const modalityField = document.getElementById('modalitySelect');
        const topicName = inputField.value.trim();
        const selectedModality = modalityField.value;
        if (!topicName) return;

        let db = JSON.parse(localStorage.getItem('teach_program_db')) || {};
        const now = new Date();
        const topic = db[topicName];

        let stability, difficulty;
        if (!topic) {
            const initial = fsrs.initializeTopic(grade);
            stability = initial.stability;
            difficulty = initial.difficulty;
        } else {
            const elapsedDays = Math.max(0, (now - new Date(topic.lastReviewed)) / (1000 * 60 * 60 * 24));
            const updated = fsrs.updateTopic(topic.stability, topic.difficulty, elapsedDays, grade);
            stability = updated.stability;
            difficulty = updated.difficulty;
        }

        const interval = fsrs.calculateNextInterval(stability);
        
        const historyEntry = {
            date: now.toISOString(),
            grade: grade,
            modality: selectedModality
        };

        db[topicName] = {
            name: topicName,
            stability: stability,
            difficulty: difficulty,
            lastReviewed: now.toISOString(),
            nextDue: new Date(now.getTime() + interval * 24 * 60 * 60 * 1000).toISOString(),
            lastModality: selectedModality,
            history: topic && topic.history ? [...topic.history, historyEntry] : [historyEntry],
            notes: topic && topic.notes ? topic.notes : []
        };

        localStorage.setItem('teach_program_db', JSON.stringify(db));
        inputField.value = "";
        window.pushToGitHubCloud(db);
        displaySchedule();
        window.loadNotebook(topicName);
    }

    window.loadTargetProfile = function(topicKey) {
        document.getElementById('fsrsTopicInput').value = topicKey;
        window.loadNotebook(topicKey);
    }

    window.loadNotebook = function(topicName) {
        window.activeNotebookTopic = topicName;
        document.getElementById('activeNotebookTitle').innerText = `Active: ${topicName}`;
        
        const db = JSON.parse(localStorage.getItem('teach_program_db')) || {};
        const topic = db[topicName];
        const container = document.getElementById('notesContainer');
        container.innerHTML = "";

        if (!topic || !topic.notes || topic.notes.length === 0) {
            container.innerHTML = "<p style='color:#718096; font-size:0.9em; margin:0;'>No saved notes for this topic yet. Add one above!</p>";
            return;
        }

        topic.notes.forEach(note => {
            const div = document.createElement('div');
            div.className = "note-item";
            div.innerHTML = `
                <span>${note.text}</span>
                <span style="color:#e53e3e; cursor:pointer; font-weight:bold; margin-left:10px;" onclick="deleteNote('${topicName}', ${note.id})">✕</span>
            `;
            container.appendChild(div);
        });
    }

    window.addNoteToActiveTopic = function() {
        const topicName = window.activeNotebookTopic || document.getElementById('fsrsTopicInput').value.trim();
        const noteText = document.getElementById('newNoteInput').value.trim();
        if (!topicName) { alert("Please select or type a topic name first."); return; }
        if (!noteText) return;

        let db = JSON.parse(localStorage.getItem('teach_program_db')) || {};
        if (!db[topicName]) {
            db[topicName] = {
                name: topicName,
                stability: 1.0,
                difficulty: 5.0,
                lastReviewed: new Date().toISOString(),
                nextDue: new Date().toISOString(),
                lastModality: "Anki",
                history: [],
                notes: []
            };
        }

        if (!db[topicName].notes) db[topicName].notes = [];
        db[topicName].notes.push({ id: Date.now(), text: noteText });

        localStorage.setItem('teach_program_db', JSON.stringify(db));
        document.getElementById('newNoteInput').value = "";
        window.pushToGitHubCloud(db);
        displaySchedule();
        window.loadNotebook(topicName);
    }

    window.deleteNote = function(topicName, noteId) {
        let db = JSON.parse(localStorage.getItem('teach_program_db')) || {};
        if (db[topicName] && db[topicName].notes) {
            db[topicName].notes = db[topicName].notes.filter(n => n.id !== noteId);
            localStorage.setItem('teach_program_db', JSON.stringify(db));
            window.pushToGitHubCloud(db);
            displaySchedule();
            window.loadNotebook(topicName);
        }
    }

    window.removeTopic = function(topicName) {
        if(confirm(`Delete "${topicName}" and all associated notes?`)) {
            let db = JSON.parse(localStorage.getItem('teach_program_db')) || {};
            delete db[topicName];
            localStorage.setItem('teach_program_db', JSON.stringify(db));
            if (window.activeNotebookTopic === topicName) {
                window.activeNotebookTopic = "";
                document.getElementById('activeNotebookTitle').innerText = "(Select a topic above)";
                document.getElementById('notesContainer').innerHTML = "<p style='color:#718096; font-size:0.9em; margin:0;'>Select a topic above to view or add notes.</p>";
            }
            window.pushToGitHubCloud(db);
            displaySchedule();
        }
    }

    window.displaySchedule = function() {
        const db = JSON.parse(localStorage.getItem('teach_program_db')) || {};
        const now = new Date();
        const listContainer = document.getElementById('scheduleList');
        listContainer.innerHTML = "";

        const topics = Object.values(db).sort((a,b) => b.difficulty - a.difficulty);
        if (topics.length === 0) {
            listContainer.innerHTML = "<li style='color: #718096;'>Queue empty.</li>";
            return;
        }

        topics.forEach(topic => {
            const isDue = new Date(topic.nextDue) <= now;
            
            let recModality = "Anki Maintenance";
            let recColor = "#4a5568"; 
            let bgLight = "#edf2f7";

            if (topic.difficulty > 7.0) {
                recModality = "TEACH Slide Pass REQUIRED";
                recColor = "#9b2c2c";
                bgLight = "#fed7d7";
            } else if (topic.difficulty > 4.5) {
                recModality = "Execute Q-Bank Pass";
                recColor = "#9c4221";
                bgLight = "#feebc8";
            } else {
                recColor = "#22543d";
                bgLight = "#c6f6d5";
            }

            const historicalLog = topic.lastModality ? ` [Last: ${topic.lastModality}]` : "";
            const noteCount = topic.notes ? topic.notes.length : 0;

            const li = document.createElement('li');
            li.innerHTML = `
                <div>
                    <strong style="cursor:pointer; color:#3182ce; text-decoration:underline;" onclick="loadTargetProfile('${topic.name}')">${topic.name}</strong><br>
                    <span style="font-size:0.75em; color:#718096;">Diff: ${topic.difficulty.toFixed(1)} | Due: ${new Date(topic.nextDue).toLocaleDateString()}${historicalLog}</span>
                    <br>
                    <span class="badge" style="background: ${bgLight}; color: ${recColor};">Target: ${recModality}</span>
                    ${noteCount > 0 ? `<span class="badge" style="background: #ebf8ff; color: #2b6cb0; margin-left: 4px; cursor:pointer;" onclick="loadTargetProfile('${topic.name}')">📝 ${noteCount} Note(s)</span>` : ''}
                    <div class="action-links"><span style="color:#e53e3e;" onclick="removeTopic('${topic.name}')">Delete Topic</span></div>
                </div>
                <span style="font-weight:bold; font-size:0.85em; color: ${isDue ? '#e53e3e' : '#38a169'}">${isDue ? "DUE" : "STABLE"}</span>
            `;
            listContainer.appendChild(li);
        });
    }
</script>
</body>
</html>
